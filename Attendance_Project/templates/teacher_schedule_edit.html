{% extends 'base.html' %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
{% endblock %}
{% block content %}
  <div class="card" style="max-width:500px; margin:0 auto">
    <h2 class="center" style="margin-bottom:28px">✏️ Edit Schedule</h2>
    <form method="post">
      <div class="form-group">
        <label>Program</label>
        <input name="program" value="{{ sched['program'] }}" required>
      </div>
      <div class="form-group">
        <label>Section</label>
        <input name="section" value="{{ sched['section'] }}" required>
      </div>
      <div class="form-group">
        <label>Weekday</label>
        <select name="weekday" required>
          <option value="0" {% if sched['weekday'] == 0 %}selected{% endif %}>Monday</option>
          <option value="1" {% if sched['weekday'] == 1 %}selected{% endif %}>Tuesday</option>
          <option value="2" {% if sched['weekday'] == 2 %}selected{% endif %}>Wednesday</option>
          <option value="3" {% if sched['weekday'] == 3 %}selected{% endif %}>Thursday</option>
          <option value="4" {% if sched['weekday'] == 4 %}selected{% endif %}>Friday</option>
          <option value="5" {% if sched['weekday'] == 5 %}selected{% endif %}>Saturday</option>
          <option value="6" {% if sched['weekday'] == 6 %}selected{% endif %}>Sunday</option>
        </select>
      </div>
      <div class="form-group">
        <label>Start Time</label>
        <input name="start_time" type="time" value="{{ sched['start_time'] }}" required>
      </div>
      <div style="display:flex; gap:12px; margin-top:28px">
        <button class="btn" type="submit" style="flex:1">💾 Save Changes</button>
        <a class="btn secondary" href="{{ url_for('teacher_schedule') }}" style="flex:1; text-align:center">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
