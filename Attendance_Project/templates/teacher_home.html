{% extends 'base.html' %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/select.css') }}">
{% endblock %}
{% block content %}
  <div class="center">
    <h2 style="margin-bottom:12px">👨‍🏫 Teacher Portal</h2>
    <p style="color:#6b7280; margin-bottom:40px">Manage students and track attendance</p>
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:20px; max-width:800px; margin:0 auto">
      <div class="card" style="text-align:center; padding:24px">
        <div style="font-size:44px; margin-bottom:12px">📊</div>
        <h3 style="margin-bottom:12px">Dashboard</h3>
        <p style="color:#6b7280; font-size:14px; margin-bottom:16px\">Manage all students</p>
        <a class="btn" href="{{ url_for('teacher_dashboard') }}" style="width:100%; text-align:center">Access</a>
      </div>
      <div class="card" style="text-align:center; padding:24px">
        <div style="font-size:44px; margin-bottom:12px">📈</div>
        <h3 style="margin-bottom:12px\">Reports</h3>
        <p style="color:#6b7280; font-size:14px; margin-bottom:16px\">View attendance logs</p>
        <a class="btn" href="{{ url_for('teacher_reports') }}" style="width:100%; text-align:center">View</a>
      </div>
      <div class="card" style="text-align:center; padding:24px">
        <div style="font-size:44px; margin-bottom:12px">📅</div>
        <h3 style="margin-bottom:12px\">Schedule</h3>
        <p style="color:#6b7280; font-size:14px; margin-bottom:16px\">Manage your schedule</p>
        <a class="btn" href="{{ url_for('teacher_schedule') }}" style="width:100%; text-align:center">Edit</a>
      </div>
    </div>
  </div>
{% endblock %}
